<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для любимой ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff1f6, #f7d9ff);
    color: #4b2435;
    text-align: center;
    overflow-x: hidden;
  }
  .wrap {
    width: min(92%, 700px);
    margin: auto;
    padding: 35px 0 50px;
  }
  h1 {
    font-size: 42px;
    margin: 15px 0 8px;
  }
  .subtitle {
    font-size: 18px;
    opacity: .8;
    margin-bottom: 28px;
  }
  .heart {
    font-size: 55px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    50% { transform: scale(1.12); }
  }
  .photos {
    display: grid;
    gap: 18px;
  }
  .photos img {
    width: 100%;
    border-radius: 22px;
    display: block;
    box-shadow: 0 8px 25px rgba(80,20,50,.18);
  }
  .message {
    margin: 28px 0;
    padding: 24px;
    border-radius: 22px;
    background: rgba(255,255,255,.65);
    box-shadow: 0 8px 25px rgba(80,20,50,.10);
    font-size: 19px;
    line-height: 1.6;
  }
  audio {
    width: 100%;
    margin-top: 10px;
  }
  .small {
    margin-top: 20px;
    font-size: 14px;
    opacity: .65;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="heart">❤️</div>
  <h1>Для любимой</h1>
  <div class="subtitle">Это маленькое место — только для тебя.</div>

  <div class="photos">
    <img src="photo1.jpg" alt="Фото">
    <img src="photo2.jpg" alt="Фото">
  </div>

  <div class="message">
    Я хочу, чтобы ты всегда знала:<br>
    ты для меня особенная. ❤️<br>
    Спасибо, что ты есть.
  </div>

  <audio controls>
    <source src="13_%2013%20%E2%80%94%20%D1%81%D1%82%D1%80%D0%BE%D1%87%D0%BA%D0%B8%20%D0%BE%20%D0%B1%D1%8B%D0%B2%D1%88%D0%B8%D1%85%20-%20og%20buda_slow%26reverb%20%28www.lightaudio.ru%29.mp3" type="audio/mpeg">
    Твой браузер не поддерживает аудио.
  </audio>

  <div class="small">Открой музыку кнопкой ▶️</div>
</div>
</body>
</html>
